<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Facebook Clone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .navbar {
      background-color: #3b5998;
    }
    .navbar input {
      margin-right: 10px;
    }
    .header-text {
      margin-top: 50px;
    }
    .left-content img {
      width: 100%;
      max-width: 500px;
    }
    .form-control {
      margin-bottom: 10px;
    }
    .signup-btn {
      background-color: #4CAF50;
      color: white;
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand fs-2" href="#">facebook</a>
    <div class="ms-auto d-flex">
      <input type="text" class="form-control form-control-sm me-2" placeholder="Email or Username">
      <input type="password" class="form-control form-control-sm me-2" placeholder="Password">
      <button class="btn btn-primary btn-sm">Login</button>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-5">
    <div class="row">
      <!-- Left Side -->
      <div class="col-md-6">
        <h3 class="header-text">Facebook is useless without friends.<br>Make More Friends.</h3>
        <div class="left-content mt-4">
          <img src="https://i.imgur.com/DYfBEch.png" alt="Facebook map example">
        </div>
      </div>

      <!-- Right Side -->
      <div class="col-md-6">
        <h2>Create an Account</h2>
        <p>It's free and always will be.</p>
        <form>
          <div class="row">
            <div class="col">
              <input type="text" class="form-control" placeholder="Firstname">
            </div>
            <div class="col">
              <input type="text" class="form-control" placeholder="Lastname">
            </div>
          </div>
          <input type="email" class="form-control" placeholder="Email">
          <input type="email" class="form-control" placeholder="Re-enter email">
          <input type="password" class="form-control" placeholder="Password">
          <input type="date" class="form-control" placeholder="dd/mm/yyyy">
          
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="gender" value="male" />
            <label class="form-check-label">Male</label>
          </div>
          <div class="form-check form-check-inline mb-3">
            <input class="form-check-input" type="radio" name="gender" value="female" />
            <label class="form-check-label">Female</label>
          </div>

          <p style="font-size: 12px;">By clicking create an account, you agree to our <a href="#">Terms</a>.</p>
          <button type="submit" class="btn signup-btn">Signup</button>
        </form>
        <p class="mt-2"><a href="#">Create a page for you.</a></p>
      </div>
    </div>
  </div>

</body>
</html>
