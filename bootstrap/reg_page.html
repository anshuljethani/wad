<!DOCTYPE html>
<html>
<head>
    <title>Event Sign Up</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
        }
        .form-container {
            background-color: white;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h1>Event Registration</h1>
            
            <form id="registrationForm">
                <!-- Personal Info -->
                <h3>Personal Information</h3>
                <hr>

                <div class="mb-3">
                    <label for="firstName" class="form-label">First Name*</label>
                    <input type="text" class="form-control" id="firstName" required>
                </div>

                <div class="mb-3">
                    <label for="lastName" class="form-label">Last Name*</label>
                    <input type="text" class="form-control" id="lastName" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email*</label>
                    <input type="email" class="form-control" id="email" required>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone*</label>
                    <input type="tel" class="form-control" id="phone" required>
                    <div class="form-text">Format: 123-456-7890</div>
                </div>

                <!-- Event Details -->
                <h3>Event Details</h3>
                <hr>

                <div class="mb-3">
                    <label for="ticketType" class="form-label">Ticket Type*</label>
                    <select class="form-select" id="ticketType" required>
                        <option value="">Choose...</option>
                        <option value="standard">Standard ($99)</option>
                        <option value="premium">Premium ($149)</option>
                        <option value="vip">VIP ($199)</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="ticketQuantity" class="form-label">Number of Tickets*</label>
                    <input type="number" class="form-control" id="ticketQuantity" min="1" value="1" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Workshops (Optional)</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="workshop1">
                        <label class="form-check-label" for="workshop1">
                            Public Speaking ($25)
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="workshop2">
                        <label class="form-check-label" for="workshop2">
                            Networking ($25)
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="workshop3">
                        <label class="form-check-label" for="workshop3">
                            Leadership ($35)
                        </label>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="specialRequests" class="form-label">Special Requests</label>
                    <textarea class="form-control" id="specialRequests" rows="3"></textarea>
                    <div class="form-text">Let us know if you have any special needs or dietary restrictions</div>
                </div>



                <!-- Terms -->
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="termsCheck" required>
                    <label class="form-check-label" for="termsCheck">I agree to the Terms and Conditions*</label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-lg w-100">Register</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Simple form validation
        document.getElementById('registrationForm').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('Thanks for registering! We will send you a confirmation email soon.');
        });
    </script>
</body>
</html>
